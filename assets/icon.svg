<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Better Paseo">
<title>Better Paseo</title>
<!-- Better Paseo: promo-hero timeline.
     Lilac field with peach and mint light, Paseo violet spine and nodes,
     lime on the current thread, white message bars.
     Tile is an iOS continuous-corner squircle. Render at 2048px and downsample to 512px. -->
<defs>
<path id="bp-t" d="M174.27 0H337.73C387.91 0 413 0 440.01 8.54C469.5 19.27 492.73 42.5 503.46 71.99C512 99 512 124.09 512 174.27V337.73C512 387.91 512 413 503.46 440.01C492.73 469.5 469.5 492.73 440.01 503.46C413 512 387.91 512 337.73 512H174.27C124.09 512 99 512 71.99 503.46C42.5 492.73 19.27 469.5 8.54 440.01C0 413 0 387.91 0 337.73V174.27C0 124.09 0 99 8.54 71.99C19.27 42.5 42.5 19.27 71.99 8.54C99 0 124.09 0 174.27 0Z"/>
<clipPath id="bp-tc">
<use href="#bp-t"/>
</clipPath>
<linearGradient id="bp-bg" x1="0.15" y1="0" x2="0.85" y2="1">
<stop stop-color="#F7F3FF"/>
<stop offset="0.48" stop-color="#E4DCFF"/>
<stop offset="1" stop-color="#DCE8FB"/>
</linearGradient>
<radialGradient id="bp-peach" cx="0.92" cy="0.08" r="0.62">
<stop stop-color="#FFD6BE" stop-opacity="0.7"/>
<stop offset="1" stop-color="#FFD6BE" stop-opacity="0"/>
</radialGradient>
<radialGradient id="bp-mint" cx="0.96" cy="0.96" r="0.55">
<stop stop-color="#A8F0DC" stop-opacity="0.62"/>
<stop offset="1" stop-color="#A8F0DC" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bp-sheen" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#fff" stop-opacity="0.55"/>
<stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="bp-trim" x1="0.2" y1="0" x2="0.5" y2="1">
<stop stop-color="#fff" stop-opacity="0.75"/>
<stop offset="0.35" stop-color="#6B4EFF" stop-opacity="0.18"/>
<stop offset="1" stop-color="#6B4EFF" stop-opacity="0.12"/>
</linearGradient>
<linearGradient id="bp-stem" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#8D7DFF"/>
<stop offset="1" stop-color="#6B4EFF"/>
</linearGradient>
<radialGradient id="bp-violet" cx="0.34" cy="0.3" r="0.85">
<stop stop-color="#8D7DFF"/>
<stop offset="0.52" stop-color="#6B4EFF"/>
<stop offset="1" stop-color="#5538E8"/>
</radialGradient>
<radialGradient id="bp-lime" cx="0.34" cy="0.3" r="0.85">
<stop stop-color="#EAFF9A"/>
<stop offset="0.48" stop-color="#D4F65A"/>
<stop offset="1" stop-color="#B6D63C"/>
</radialGradient>
<linearGradient id="bp-bar" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#FFFFFF"/>
<stop offset="1" stop-color="#F3EFFF"/>
</linearGradient>
<filter id="bp-bar-shadow" x="-20%" y="-30%" width="140%" height="180%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6B4EFF" flood-opacity="0.2"/>
</filter>
<filter id="bp-node-shadow" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6B4EFF" flood-opacity="0.32"/>
</filter>
<filter id="bp-lime-shadow" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#B4C828" flood-opacity="0.35"/>
</filter>
</defs>
<g clip-path="url(#bp-tc)">
<rect width="512" height="512" fill="url(#bp-bg)"/>
<rect width="512" height="512" fill="url(#bp-peach)"/>
<rect width="512" height="512" fill="url(#bp-mint)"/>
<rect width="512" height="512" fill="url(#bp-sheen)"/>
<rect x="125" y="162" width="18" height="188" rx="9" fill="url(#bp-stem)"/>
<g filter="url(#bp-bar-shadow)">
<rect x="178" y="131" width="236" height="62" rx="31" fill="url(#bp-bar)"/>
<rect x="178" y="225" width="166" height="62" rx="31" fill="url(#bp-bar)"/>
<rect x="178" y="319" width="206" height="62" rx="31" fill="url(#bp-bar)"/>
</g>
<g filter="url(#bp-node-shadow)">
<circle cx="134" cy="162" r="36" fill="url(#bp-violet)"/>
<circle cx="134" cy="350" r="36" fill="url(#bp-violet)"/>
</g>
<g filter="url(#bp-lime-shadow)">
<circle cx="134" cy="256" r="36" fill="url(#bp-lime)"/>
</g>
</g>
<use href="#bp-t" fill="none" stroke="url(#bp-trim)" stroke-width="3" clip-path="url(#bp-tc)"/>
</svg>
