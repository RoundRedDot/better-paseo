<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Better Paseo">
<title>Better Paseo</title>
<!-- Better Paseo: liquid glass timeline.
     Layers, back to front: graphite tile with a low Paseo-jade glow; a clear glass stem;
     three frosted glass rows whose backdrop is the blurred, magnified tile, lit white along
     the top rim and catching refracted jade along the bottom; dense milky glass beads that
     sit on each row's left cap and cast a soft shadow onto the glass.
     Tile is an iOS continuous-corner squircle. Render at 2048px and downsample to 512px. -->
