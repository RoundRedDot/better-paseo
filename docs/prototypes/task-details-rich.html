  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f5ed2c37-bfa2-43de-afb2-e06691b9f579\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<script src=\"1280e7b3-47b2-4cd1-b28a-a5e2453ee045\"><\u002Fscript>\n<style>body{margin:0;background:#e7e7ea}a{color:#2563eb}a:hover{color:#1d4ed8}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"padding:80px;display:flex;flex-direction:column;gap:80px;font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;color:#18181b;font-variant-numeric:tabular-nums;width:max-content\">\n\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:960px\">\n    <div style=\"font-size:13px;color:#62626b;font-weight:500\">Better Paseo · 任务泳道看板<\u002Fdiv>\n    <div style=\"font-size:40px;font-weight:600;letter-spacing:-0.02em\">卡片详情 v2<\u002Fdiv>\n    <div style=\"font-size:15px;line-height:1.6;color:#62626b;text-wrap:pretty\">桌面右侧详情侧边栏与手机 / 平板详情 sheet。首屏主块按状态切换，其余内容收进可折叠区块；数字用 View 拼出的环、条和时间轴表达比例与进度。所有画板中的卡片是同一个组件，交互可直接在画板上试（hover 行、复制、折叠、图表 tooltip）。<\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-screen-label=\"01 桌面浅色\" style=\"display:flex;flex-direction:column;gap:24px;--s0:#ffffff;--s1:#f6f6f7;--s2:#ededef;--bd:#e2e2e6;--fg:#18181b;--fm:#62626b;--ac:#2563eb;--ok:#1f8a5b;--wn:#a36a00;--dg:#d92d20;--run:#268ae0;--inp:#b37824;--unr:#299f51;--fail:#f12e2f;--card:#ffffff;--side:#f6f6f7;--sh:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03)\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><span style=\"font-size:13px;font-weight:600;color:#62626b\">画板 1<\u002Fspan><span style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em\">桌面侧边栏 · 浅色 · 380<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:flex-start\">\n      <div style=\"width:400px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">现状（已上线）<\u002Fdiv>\n        <img src=\"f35ce7be-e212-46fe-ab07-cc0a693bdc6a\" alt=\"现状详情卡\" style=\"width:400px;display:block;border-radius:12px;opacity:.95\">\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">全部是「标签 + 文字值」平铺行；比例只有一条上下文进度条；状态、模式、git 状态都是灰字。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">运行中<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" hint-size=\"100%,820px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">首屏：本轮计时（每秒刷新）+ 上下文环。随后子任务分段条、属性、Token 构成、时间线。头部右侧「停止」。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">待输入<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"input\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">首屏：权限请求（类型图标、命令摘要、允许 / 拒绝、剩余请求数、等待时长）。上下文 81% 进入 warning；用量区默认折叠，标题右侧保留摘要。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">失败<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"failed\" hint-size=\"100%,700px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">首屏：错误原文（等宽 3 行截断，可复制 / 展开）。活动提到用量之前，时间线末段用失败色。父任务带「已归档」徽标。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">已完成<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"done\" hint-size=\"100%,860px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">首屏：结果摘要三格（上一轮耗时 / 费用 / Token）。tab 已打开时按钮变为「切换到 tab」。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"02 桌面深色\" style=\"display:flex;flex-direction:column;gap:24px;padding:48px;margin:0 -48px;border-radius:24px;background:#141416;color:#f2f3f5;--s0:#0f0f11;--s1:#17171a;--s2:#1f1f23;--bd:#2a2a30;--fg:#f2f3f5;--fm:#a3a6ad;--ac:#7aa2f7;--ok:#4cb782;--wn:#e0a84a;--dg:#f2555a;--run:#5caaf6;--inp:#db932e;--unr:#35c264;--fail:#f7796d;--card:#1f1f23;--side:#0f0f11;--sh:0 1px 2px rgba(0,0,0,.4)\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><span style=\"font-size:13px;font-weight:600;color:#a3a6ad\">画板 2<\u002Fspan><span style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em\">桌面侧边栏 · 深色 · 宽 520 · 数据缺失<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:flex-start\">\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:600\">运行中<\u002Fdiv><div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" hint-size=\"100%,820px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:600\">待输入<\u002Fdiv><div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"input\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:600\">失败<\u002Fdiv><div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"failed\" hint-size=\"100%,700px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:14px;font-weight:600\">已完成<\u002Fdiv><div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"done\" hint-size=\"100%,860px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <div style=\"width:520px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">宽 520 · 运行中<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" hint-size=\"100%,760px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#a3a6ad\">内容宽 ≥ 456 时属性变两列（项目 | 分支），PR / 目录 / 父任务始终整行；首屏两格、摘要三格按比例拉宽；图例单行。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">数据大量缺失（退化）<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"sparse\" hint-size=\"100%,600px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#a3a6ad\">无用量 / 上下文：摘要格显示「—」+ 未上报，条换虚线空轨。非 git 目录：分支行 muted，无复制、无徽标，PR 行隐藏。无子任务、父任务、标签、思考等级：对应区块 / 行 / 胶囊隐藏。时间线只剩创建 → 更新单段。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"03 桌面交互\" style=\"display:flex;flex-direction:column;gap:24px;--s0:#ffffff;--s1:#f6f6f7;--s2:#ededef;--bd:#e2e2e6;--fg:#18181b;--fm:#62626b;--ac:#2563eb;--ok:#1f8a5b;--wn:#a36a00;--dg:#d92d20;--run:#268ae0;--inp:#b37824;--unr:#299f51;--fail:#f12e2f;--card:#ffffff;--side:#f6f6f7;--sh:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03)\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><span style=\"font-size:13px;font-weight:600;color:#62626b\">画板 3<\u002Fspan><span style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em\">桌面交互<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:40px;align-items:flex-start\">\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">图表 hover tooltip<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"done\" demo=\"tooltip\" hint-size=\"100%,860px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">悬停 Token 段：其余段降到 40% 不透明，tooltip 显示精确 token、占比与合计。近右端时右对齐，近左端时左对齐。上下文环 / 条悬停显示「已用 / 上限」精确值；时间线点悬停显示绝对时间。延迟 120ms 出现。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">行 hover · 次级动作<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" demo=\"hover\" hint-size=\"100%,820px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">行底色 mix(foreground 5%)。行尾出现 24px 图标按钮：分支 → 复制；PR → 外链、复制；目录 → 复制、在 Finder 打开；父任务 → 在看板中定位。值优先截断，徽标保留。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">复制反馈<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" demo=\"copied\" hint-size=\"100%,820px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">点击可复制行（或 Enter / ⌘C）：动作按钮替换为 success 色对勾 +「已复制」，1200ms 后淡回。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">区块折叠<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" demo=\"collapsed\" hint-size=\"100%,560px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">选可折叠区块标题，不用页签：首屏主块已承担「先看什么」，页签会把图表藏到第二屏。折叠后 chevron 转 -90°，标题右侧保留一行摘要（分支名、$5.20 · 23%）。折叠状态按区块 key 全局记忆。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:380px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:14px;font-weight:600\">键盘焦点<\u002Fdiv>\n        <div style=\"background:var(--side);border:1px solid var(--bd);border-radius:14px;padding:12px\"><dc-import name=\"DetailCard\" state=\"running\" demo=\"focus\" hint-size=\"100%,820px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.7;color:#62626b\">焦点环 2px accent，随元素圆角。行获得焦点时同时显示其次级动作。Tab 顺序：钉住 → 关闭 → 打开 tab → 停止 / 允许 / 拒绝 → 区块标题 → 区块内行 → 行内动作。Esc 关闭详情，↑↓ 在同泳道卡片间切换。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"04 手机 390\" style=\"display:flex;flex-direction:column;gap:24px;--s0:#ffffff;--s1:#f6f6f7;--s2:#ededef;--bd:#e2e2e6;--fg:#18181b;--fm:#62626b;--ac:#2563eb;--ok:#1f8a5b;--wn:#a36a00;--dg:#d92d20;--run:#268ae0;--inp:#b37824;--unr:#299f51;--fail:#f12e2f;--card:#ffffff;--side:#f6f6f7;--sh:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03)\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><span style=\"font-size:13px;font-weight:600;color:#62626b\">画板 4<\u002Fspan><span style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em\">手机 390 · 详情 sheet<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:56px;align-items:flex-start\">\n      <sc-for list=\"{{ phones }}\" as=\"ph\" hint-placeholder-count=\"5\">\n        <div style=\"width:390px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"font-size:14px;font-weight:600\">{{ ph.name }}<\u002Fdiv>\n          <div style=\"width:390px;height:844px;border-radius:52px;background:var(--s1);position:relative;overflow:hidden;box-shadow:0 0 0 10px #1c1c1f, 0 24px 60px rgba(0,0,0,.18)\">\n            <div style=\"position:absolute;left:0;right:0;top:0;padding:64px 16px 0;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:22px;font-weight:600;color:var(--fg)\">99 个任务<\u002Fdiv>\n              <div style=\"display:flex;gap:14px;font-size:13px;color:var(--fm)\"><span>待输入 0<\u002Fspan><span style=\"color:var(--fg);font-weight:500\">运行中 11<\u002Fspan><span>待查看 48<\u002Fspan><span>已完成 40<\u002Fspan><\u002Fdiv>\n              <div style=\"height:104px;border-radius:12px;background:var(--s0);border:1px solid var(--bd)\"><\u002Fdiv>\n              <div style=\"height:104px;border-radius:12px;background:var(--s0);border:1px solid var(--bd)\"><\u002Fdiv>\n              <div style=\"height:104px;border-radius:12px;background:var(--s0);border:1px solid var(--bd)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.28)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:0;top:{{ ph.top }};background:var(--s0);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden\">\n              <div style=\"height:20px;display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:36px;height:5px;border-radius:3px;background:var(--bd)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"height:44px;display:flex;align-items:center;padding:0 4px;flex:none;color:var(--fm)\">\n                <div style=\"width:44px;height:44px;display:flex;align-items:center;justify-content:center\">{{ ic.ChevronLeft }}<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font-size:13px\">{{ ph.nav }}<\u002Fdiv>\n                <div style=\"width:44px;height:44px;display:flex;align-items:center;justify-content:center\">{{ ic.ChevronRight }}<\u002Fdiv>\n                <div style=\"width:1px;height:20px;background:var(--bd);margin:0 2px\"><\u002Fdiv>\n                <div style=\"width:44px;height:44px;display:flex;align-items:center;justify-content:center\">{{ ic.X }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;overflow:hidden;position:relative\">\n                <div style=\"display:flex;gap:12px;transform:{{ ph.shift }};--card-bd:none;--card-sh:none;--card-r:0;--px:16px;--row:44px;--ic:18px;--ics:16px;--fs:15px;--fs-s:13px;--fs-t:17px;--chip:28px;--btn:44px;--lbl:76px;--row-s:44px;--sh-h:44px\">\n                  <div style=\"width:390px;flex:none\"><dc-import name=\"DetailCard\" state=\"{{ ph.state }}\" demo=\"{{ ph.demo }}\" hide-actions=\"{{ true }}\" hide-chrome=\"{{ true }}\" touch=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fdiv>\n                  <sc-if value=\"{{ ph.swipe }}\"><div style=\"width:390px;flex:none;border-left:1px solid var(--bd)\"><dc-import name=\"DetailCard\" state=\"input\" hide-actions=\"{{ true }}\" hide-chrome=\"{{ true }}\" touch=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ ph.swipe }}\">\n                  <div style=\"position:absolute;top:120px;right:84px;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--fg);color:var(--s0);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18)\">松手切换 · 运行中 4 / 11{{ ic.ChevronRight }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px;background:var(--s0);border-top:1px solid var(--bd);display:flex;gap:10px\">\n                <sc-if value=\"{{ ph.barRun }}\">\n                  <button style=\"flex:1;height:48px;border-radius:12px;border:none;background:var(--ac);color:var(--s0);font:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px\">{{ ic.AppWindow }}打开 tab<\u002Fbutton>\n                  <button style=\"height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--s0);color:var(--fg);font:inherit;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px\"><span style=\"display:flex;color:var(--dg)\">{{ ic.Square }}<\u002Fspan>停止<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ ph.barInput }}\">\n                  <button title=\"打开 tab\" style=\"width:48px;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--s0);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none\">{{ ic.AppWindow }}<\u002Fbutton>\n                  <button style=\"flex:1;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--s0);color:var(--fg);font:inherit;font-size:16px;font-weight:500\">拒绝<\u002Fbutton>\n                  <button style=\"flex:1;height:48px;border-radius:12px;border:none;background:var(--ac);color:var(--s0);font:inherit;font-size:16px;font-weight:600\">允许<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.7;color:#62626b\">{{ ph.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"05 平板\" style=\"display:flex;flex-direction:column;gap:24px;--s0:#ffffff;--s1:#f6f6f7;--s2:#ededef;--bd:#e2e2e6;--fg:#18181b;--fm:#62626b;--ac:#2563eb;--ok:#1f8a5b;--wn:#a36a00;--dg:#d92d20;--run:#268ae0;--inp:#b37824;--unr:#29       <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:380px;flex:none;padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow:hidden;--px:16px;--row:44px;--ic:18px;--ics:16px;--fs:15px;--fs-s:13px;--fs-t:17px;--chip:28px;--btn:44px;--lbl:76px;--row-s:44px;--sh-h:44px\">\n            <div style=\"background:var(--s0);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)\">\n              <div style=\"font-size:20px;font-weight:600\">99 个任务<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:13px;color:var(--fm)\"><span>待输入 0<\u002Fspan><span>运行中 11<\u002Fspan><span>待查看 48<\u002Fspan><span>已完成 40<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <dc-import name=\"DetailCard\" state=\"running\" touch=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:14px;font-weight:600\">iPad 820 竖屏 · 浮动面板 400<\u002Fdiv>\n        <div style=\"width:820px;height:1180px;border-radius:28px;background:var(--s1);overflow:hidden;position:relative;box-shadow:0 0 0 12px #1c1c1f, 0 24px 60px rgba(0,0,0,.18)\">\n          <div style=\"position:absolute;left:24px;top:24px;right:0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-size:20px;font-weight:600\">任务<\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <sc-for list=\"{{ lanes }}\" as=\"ln\" hint-placeholder-count=\"4\">\n                <div style=\"width:260px;flex:none;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"display:flex;align-items:center;gap:6px;height:28px;font-size:13px;font-weight:500\"><span style=\"width:8px;height:8px;border-radius:999px;background:{{ ln.c }}\"><\u002Fspan>{{ ln.name }}<span style=\"color:var(--fm);font-weight:400\">{{ ln.n }}<\u002Fspan><\u002Fdiv>\n                  <sc-for list=\"{{ ln.cards }}\" as=\"cd\">\n                    <div style=\"background:var(--s0);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:{{ cd.ring }}\">\n                      <div style=\"font-size:14px;font-weight:500;line-height:1.4\">{{ cd.t }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:var(--fm)\">{{ cd.m }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;right:16px;top:72px;width:400px;max-height:1092px;overflow:hidden;border-radius:16px;--card-r:16px;--card-sh:0 16px 48px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.06);--px:16px;--row:44px;--ic:18px;--ics:16px;--fs:15px;--fs-s:13px;--fs-t:17px;--chip:28px;--btn:44px;--lbl:76px;--row-s:44px;--sh-h:44px\">\n            <dc-import name=\"DetailCard\" state=\"input\" touch=\"{{ true }}\" hint-size=\"100%,900px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:300px;font-size:12px;line-height:1.8;color:#62626b;padding-top:36px\">\n        <div style=\"font-size:14px;font-weight:600;color:#18181b;margin-bottom:8px\">平板规则<\u002Fdiv>\n        <div>· 布局与桌面卡片相同（动作在卡内，不吸底），尺寸用触屏档：行高 44、图标 18、字号 15、按钮 44。<\u002Fdiv>\n        <div>· 横屏 ≥ 1024：侧栏内嵌，宽 380，可拖拽 340–520。<\u002Fdiv>\n        <div>· 竖屏：浮动面板宽 400，距右 / 底 16，圆角 16，大投影；点空白或下滑关闭。<\u002Fdiv>\n        <div>· 无 hover：tooltip 改为点按；行尾次级动作改为长按菜单；外接键盘 / 触控板时恢复桌面 hover 与焦点环。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"06 移植规格\" style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\"><span style=\"font-size:13px;font-weight:600;color:#62626b\">画板 6<\u002Fspan><span style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em\">移植规格<\u002Fspan><\u002Fdiv>\n    <div style=\"width:1560px;background:#ffffff;border:1px solid #e2e2e6;border-radius:16px;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:40px;font-size:13px;line-height:1.6\">\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:18px;font-weight:600\">1 · 图表（全部 View 拼法，无 SVG / canvas）<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:150px 230px minmax(0,1fr) 150px 300px;border-top:1px solid #e2e2e6\">\n          <div style=\"padding:8px 12px 8px 0;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">图表<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">字段<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">View 拼法<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">尺寸<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">阈值 / 规则<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">上下文环（运行中首屏）<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">context.used, context.max<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">44×44 容器。轨道：圆 borderWidth 4，颜色 track。弧：左右两个 22×44 overflow:hidden 半框，各放一个 44×44 圆（borderWidth 4，只给 borderBottom / borderLeft 着色，其余 transparent）。θ = pct×360；右半 rotate(min(θ,180)+45deg)，左半 rotate(max(θ,180)+45deg)，θ ≤ 180 时左半 opacity 0。单色连续弧，平头。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">44 / 线宽 4；数值 22/600<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">&lt;75% foregroundMuted，75–89% warning，≥90% danger（弧与百分比文字同色；&lt;75 时文字 foreground）。&gt;100% 画满环。缺失：2px 虚线圆 +「未上报」。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">上下文条（用量区，非运行态）<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">同上<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">轨道 View（radius 3，overflow hidden）+ 填充 View width=pct%；在 75% 和 90% 处各放一个 2px 宽、card 色的绝对定位 View 作刻度切口。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">高 6<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">同上阈值。缺失：1px 虚线空轨。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">Token 构成堆叠条<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">cachedInputTokens, inputTokens, outputTokens<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">flexDirection row，gap 2；每段 sc-camel-flex-grow = token 数，flexBasis 0，minWidth 3，radius 2。下方图例：8×8 方块（radius 2）+ 名称 muted + 值。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">高 8；图例 12<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">顺序 缓存 → 新输入 → 输出。值 &gt;0 但比例极小时 minWidth 3 保证可见。缺某项：不画该段，图例也不出。全缺：虚线空轨 + 文案。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">本轮计时<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">turnStartedAt, lastTurnMs<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">Text，每 1s 用 now − turnStartedAt 重算；下方「上一轮 lastTurnMs」。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">22/600 · 11<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">m:ss，≥1h 为 h:mm:ss。无 turnStartedAt 显示「启动中」。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">子任务分段条<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">children[].status<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">row，gap 2，每段 sc-camel-flex-grow = 该状态计数，radius 3；下方计数图例（6px 点 + 状态 + 数）；再下为子任务行。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">高 6<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">段序 已完成 → 待查看 → 运行中 → 待输入 → 失败；颜色为状态点色，已完成用 foregroundMuted。行数 &gt;5 时显示前 5 +「其余 N 个」。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">时间线<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">createdAt, lastUserMessageAt, turnStartedAt（待输入用 attentionAt）, updatedAt / now<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">高 66 的相对容器：2px 轨道 + 每段 2px 绝对定位 View（left / width 为百分比）；8×8 点（borderWidth 1.5）；段中点上方时长，点下方「名称 / 相对时间」两行，首点左对齐、末点右对齐、其余居中。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">轨 2 / 点 8 / 字 11<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">段宽 = max(时长 / 总时长, 20%) 后归一化，保证标签不重叠。进行中 / 等待中 / 失败时末段与末点用状态色。缺失点直接跳过；只剩 2 点为单段。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500;border-bottom:1px solid #ededef\">Git 徽标<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">ahead, behind, dirty, isGit<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">胶囊 View：高 20，padding 0 7，radius 999，hairline 边；「↑a ↓b」文本；未提交 = 6px warning 点 +「未提交」。<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">20 / 字 11<\u002Fdiv><div style=\"padding:10px 12px;border-bottom:1px solid #ededef\">a、b 均为 0 不显示。非 git：分支行值「非 git 目录」muted，无徽标。每行最多一个彩色元素（只有未提交点着色）。<\u002Fdiv>\n          <div style=\"padding:10px 12px 10px 0;font-weight:500\">结果摘要三格<\u002Fdiv><div style=\"padding:10px 12px\">lastTurnMs, costUsd, token 合计, cached / 合计<\u002Fdiv><div style=\"padding:10px 12px\">外层 View bg border、radius 10、overflow hidden，三格 flex 1、gap 1（gap 透出 border 色作为分隔线），格 bg sunk。<\u002Fdiv><div style=\"padding:10px 12px\">值 18/600<\u002Fdiv><div style=\"padding:10px 12px\">缺失值显示「—」muted + 副标「未上报」。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:18px;font-weight:600\">2 · 各状态区块顺序与折叠<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:90px minmax(0,1fr) 120px;border-top:1px solid #e2e2e6\">\n            <div style=\"padding:8px 0;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">状态<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">顺序（头部之后）<\u002Fdiv><div style=\"padding:8px 0;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">默认折叠<\u002Fdiv>\n            <div style=\"padding:9px 0;border-bottom:1px solid #ededef\">运行中<\u002Fdiv><div style=\"padding:9px 12px;border-bottom:1px solid #ededef\">本轮计时 + 上下文环 → 子任务 → 属性 → 用量 → 活动<\u002Fdiv><div style=\"padding:9px 0;border-bottom:1px solid #ededef\">无<\u002Fdiv>\n            <div style=\"padding:9px 0;border-bottom:1px solid #ededef\">待输入<\u002Fdiv><div style=\"padding:9px 12px;border-bottom:1px solid #ededef\">权限请求 → 属性 → 子任务 → 用量 → 活动<\u002Fdiv><div style=\"padding:9px 0;border-bottom:1px solid #ededef\">用量<\u002Fdiv>\n            <div style=\"padding:9px 0;border-bottom:1px solid #ededef\">失败<\u002Fdiv><div style=\"padding:9px 12px;border-bottom:1px solid #ededef\">错误原文 → 属性 → 活动 → 用量 → 子任务<\u002Fdiv><div style=\"padding:9px 0;border-bottom:1px solid #ededef\">用量<\u002Fdiv>\n            <div style=\"padding:9px 0;border-bottom:1px solid #ededef\">手动停止<\u002Fdiv><div style=\"padding:9px 12px;border-bottom:1px solid #ededef\">同失败；图标 OctagonX muted，标题「已手动停止」，无原文时只一行<\u002Fdiv><div style=\"padding:9px 0;border-bottom:1px solid #ededef\">用量<\u002Fdiv>\n            <div style=\"padding:9px 0\">待查看 / 已完成<\u002Fdiv><div style=\"padding:9px 12px\">结果摘要三格 → 子任务 → 属性 → 用量 → 活动<\u002Fdiv><div style=\"padding:9px 0\">无<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"color:#62626b;line-height:1.8\">· 头部与首屏主块不可折叠。<br>· 用户操作按区块 key 全局记忆（bp.detail.collapsed），优先于状态默认值。<br>· 空区块隐藏（子任务）；用量与活动始终保留，以显示退化文案。<br>· 待输入时多个请求：首屏只显示第一个，右上「还有 N 个请求」。question 类型的按钮为「回答」，plan 类型显示计划摘要。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:18px;font-weight:600\">3 · 行语法<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);border-top:1px solid #e2e2e6\">\n            <div style=\"padding:8px 0;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">元素<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">桌面<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">触屏（手机 / 平板）<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">属性行高<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">32<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">44<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">文字距卡边<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">12（区块 6 + 行 6）<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">16（区块 10 + 行 6）<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">图标<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">lucide 16 / 描边 1.5 / muted；胶囊内 14<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">18；胶囊内 16<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">标签列 / 值<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">宽 64，13 muted；值 13 单行截断<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">宽 76，15；值 15<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">区块标题<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">高 32，12/500 muted + chevron 14，右侧摘要<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">高 44，13/500<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">标题 / 胶囊<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">15/600 · 胶囊高 22，radius 999，hairline<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">17/600 · 胶囊高 28<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">按钮<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">32，radius 8；请求按钮 28<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">卡内 44；吸底 48，radius 12，底部留 34<\u002Fdiv>\n            <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">徽标 / 子任务行<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">徽标 20 / 11；子任务行 30<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">徽标 20 / 11；子任务行 44<\u002Fdiv>\n            <div style=\"padding:7px 0\">宽度自适应<\u002Fdiv><div style=\"padding:7px 12px\">340–455：单列；≥456（onLayout 内容宽）：属性两列 50%，PR / 目录 / 父任务整行<\u002Fdiv><div style=\"padding:7px 12px\">手机始终单列<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:18px;font-weight:600\">4 · 颜色公式（mix = sRGB 线性混合）<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) 110px 110px;border-top:1px solid #e2e2e6\">\n            <div style=\"padding:8px 0;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">用途<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">公式<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">浅<\u002Fdiv><div style=\"padding:8px 12px;color:#62626b;font-weight:500;border-bottom:1px solid #e2e2e6\">深<\u002Fdiv>\n            <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"12\">\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">{{ c.u }}<\u002Fdiv>\n              <div style=\"padding:7px 12px;border-bottom:1px solid #ededef;font-family:ui-monospace, 'SF Mono', Menlo, monospace;font-size:12px\">{{ c.f }}<\u002Fdiv>\n              <div style=\"padding:7px 12px;border-bottom:1px solid #ededef;display:flex;align-items:center;gap:6px;font-family:ui-monospace, 'SF Mono', Menlo, monospace;font-size:12px\"><span style=\"width:12px;height:12px;border-radius:3px;background:{{ c.l }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)\"><\u002Fspan>{{ c.l }}<\u002Fdiv>\n              <div style=\"padding:7px 12px;border-bottom:1px solid #ededef;display:flex;align-items:center;gap:6px;font-family:ui-monospace, 'SF Mono', Menlo, monospace;font-size:12px\"><span style=\"width:12px;height:12px;border-radius:3px;background:{{ c.d }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)\"><\u002Fspan>{{ c.d }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:32px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:18px;font-weight:600\">5 · 动画参数<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);border-top:1px solid #e2e2e6\">\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">区块折叠<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">高度 + opacity 180ms，cubic-bezier(.2,0,0,1)；chevron 0 → -90° 同步<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">Tooltip<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">hover 延迟 120ms，出现 120ms fade + translateY 2→0，消失 80ms；触屏点按保持，点别处或 3s 后收起<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">图表段高亮<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">非选中段 opacity 1 → 0.4，120ms<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">复制反馈<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">立即替换为对勾，停留 1200ms，150ms 淡回<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">数值变化<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">条宽、环旋转 240ms ease-out；计时器每 1s 刷新，无过渡<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">运行中状态点<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">opacity 1 ↔ 0.45，1.6s ease-in-out 循环；减弱动效时关闭<\u002Fdiv>\n              <div style=\"padding:7px 0;border-bottom:1px solid #ededef\">Sheet<\u002Fdiv><div style=\"padding:7px 12px;border-bottom:1px solid #ededef\">spring damping 30 / stiffness 300 / mass 1；吸附点 470（半屏）、屏高 − 54（全屏）；下拉超过 25% 或速度 &gt; 1200 关闭<\u002Fdiv>\n              <div style=\"padding:7px 0\">左右滑切换<\u002Fdiv><div style=\"padding:7px 12px\">跟手；|dx| &gt; 64 或 |vx| &gt; 600 切换，220ms ease-out；首尾橡皮筋系数 0.3；拖过 32 显示「松手切换」提示；切换后 haptic selection<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:18px;font-weight:600\">6 · 需新增数据（主稿未使用）<\u002Fdiv>\n            <div style=\"color:#62626b;line-height:1.8\">· PR 状态（open / draft / merged / closed）与 CI 结果：可在 PR 行加状态徽标。<br>· 每轮耗时历史 turns[]：可在活动区画最近 N 轮耗时的柱条。<br>· 每轮费用：可把费用拆成按轮次的堆叠条。<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ready: !!(window.lucide && window.lucide.icons) };\n  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.lucide && window.lucide.icons) { clearInterval(this.p); this.setState({ ready: true }); } }, 120); }\n  componentWillUnmount() { clearInterval(this.p); }\n  icon(name) {\n    const L = window.lucide, n = L && L.icons && L.icons[name], st = { width: 20, height: 20, flex: 'none', display: 'block' };\n    if (!n) return React.createElement('span', { style: st });\n    const kids = n[0] === 'svg' ? n[2] : n;\n    return React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', style: st }, kids.map((k, i) => { const a = Object.assign({}, k[1]); delete a.key; a.key = i; return React.createElement(k[0], a); }));\n  }\n  renderVals() {\n    const ic = {}; ['ChevronLeft', 'ChevronRight', 'X', 'AppWindow', 'Square'].forEach(n => ic[n] = this.icon(n));\n    const base = { shift: 'none', swipe: false, demo: 'none', barRun: true, barInput: false };\n    const phones = [\n      Object.assign({}, base, { name: '半屏 · 运行中', top: '374px', state: 'running', nav: '运行中 · 3 / 11', note: '半屏只露头部和首屏主块（本轮计时 + 上下文环）。吸底「打开 tab」为主按钮，旁边「停止」。上拉到全屏。' }),\n      Object.assign({}, base, { name: '全屏 · 运行中', top: '54px', state: 'running', nav: '运行中 · 3 / 11', note: '全屏展示全部区块，可滚动；吸底栏保持。行高 44、图标 18、字号 15。' }),\n      Object.assign({}, base, { name: '半屏 · 待输入', top: '374px', state: 'input', nav: '待输入 · 1 / 3', barRun: false, barInput: true, note: '权限请求在首屏，按钮移到吸底栏：允许为主按钮，拒绝次级，「打开 tab」收为 48 方形图标按钮。question 类型时为「回答」。' }),\n      Object.assign({}, base, { name: '左右滑切换', top: '374px', state: 'running', nav: '运行中 · 3 / 11', shift: 'translateX(-96px)', swipe: true, note: '内容跟手左移，下一张从右侧露出；超过阈值出现「松手切换」提示。顶部 ‹ › 也可切换，计数实时更新。' }),\n      Object.assign({}, base, { name: '点按图表显示数值', top: '374px', state: 'running', nav: '运行中 · 3 / 11', demo: 'tapring', note: '触屏无 hover：点按上下文环 / Token 段弹出精确数值，再点一次或点别处收起。' })\n    ];\n    const lanes = [\n      { name: '待输入', c: 'var(--inp)', n: 0, cards: [] },\n      { name: '运行中', c: 'var(--run)', n: 11, cards: [{ t: 'better-paseo 表格节点数与流式重渲染优化', m: 'Opus 5.5 · 本轮 4:12', ring: '0 0 0 2px var(--ac)' }, { t: '迁移详情 sheet 手势到 Reanimated 4', m: 'GPT-5.5 Codex', ring: 'none' }, { t: '修复 iOS 键盘遮挡输入框', m: 'Sonnet 5', ring: 'none' }] },\n      { name: '待查看', c: 'var(--unr)', n: 48, cards: [{ t: '整理 scripts 目录下的一次性脚本', m: 'Sonnet 5 · 刚刚', ring: 'none' }, { t: '看板泳道拖拽排序', m: 'Opus 5.5 · 20 分钟前', ring: 'none' }] },\n      { name: '已完成', c: 'var(--fm)', n: 40, cards: [{ t: '统计卡计数动画', m: 'Opus 5.5 · 1 小时前', ring: 'none' }, { t: '侧栏宽度拖拽', m: 'Gemini 3 Pro · 2 小时前', ring: 'none' }] }\n    ];\n    const colors = [\n      { u: '卡片底 card', f: '浅 surface0 / 深 surface2', l: '#ffffff', d: '#1f1f23' },\n      { u: '侧栏底', f: '浅 surface1 / 深 surface0', l: '#f6f6f7', d: '#0f0f11' },\n      { u: '内嵌块 sunk', f: 'mix(foreground 2.5%, card)', l: '#f9f9f9', d: '#242428' },\n      { u: '行 hover', f: 'mix(foreground 5%, card)', l: '#f3f3f3', d: '#2a2a2e' },\n      { u: '图表轨道', f: 'mix(foreground 9%, card)', l: '#eaeaea', d: '#323236' },\n      { u: '时间线已过段', f: 'mix(foreground 16%, card)', l: '#dadada', d: '#414145' },\n      { u: 'Token 缓存', f: 'mix(accent 32%, card)', l: '#b9cdf9', d: '#3c4967' },\n      { u: 'Token 新输入', f: 'accent', l: '#2563eb', d: '#7aa2f7' },\n      { u: 'Token 输出', f: 'mix(foreground 45%, card)', l: '#979798', d: '#7e7e81' },\n      { u: '错误块底', f: 'mix(danger 6%, card)', l: '#fdf2f2', d: '#2c2226' },\n      { u: '错误块边', f: 'mix(danger 28%, card)', l: '#f4c4c1', d: '#5a2e32' },\n      { u: '项目头像底', f: 'mix(accent 14%, card)，字 accent', l: '#e0e9fc', d: '#2c3141' },\n      { u: 'Tooltip 底 / 字', f: 'foreground / card', l: '#18181b', d: '#f2f3f5' },\n      { u: 'Tooltip 次文字', f: 'mix(card 65%, foreground)', l: '#aeaeaf', d: '#69696c' },\n      { u: '主按钮文字', f: 'surface0（accent 底）', l: '#ffffff', d: '#0f0f11' },\n      { u: '焦点环', f: 'accent，2px', l: '#2563eb', d: '#7aa2f7' },\n      { u: '阈值 &lt;75 / 75–89 / ≥90', f: 'foregroundMuted / warning / danger', l: '#a36a00', d: '#e0a84a' }\n    ];\n    colors[16].u = '阈值 <75 / 75–89 / ≥90';\n    return { ic, phones, lanes, colors };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
